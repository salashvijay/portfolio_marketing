server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # One site at vihsmai.com. Old addresses forward here, keeping the page path.
  if ($host = www.vihsmai.com) { return 301 https://vihsmai.com$request_uri; }
  if ($host = labs.vihsmai.com) { return 301 https://vihsmai.com/labs$request_uri; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # No access log: visitors are not tracked.
  access_log off;

  location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

  # Free tools: browser-only. No cookies, no third-party scripts, nothing stored on the server.
  location = /labs { return 301 /labs/; }
  location ^~ /labs/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
