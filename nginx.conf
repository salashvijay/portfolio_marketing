server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Static, browser-only tools: no cookies, no third-party scripts, nothing stored on the server.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # No access log: visitors are not tracked.
  access_log off;

  location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
  location /tests/ { return 404; }
  location / { try_files $uri $uri/ =404; }
  location ~* \.(css|js|svg|png)$ { expires 7d; add_header Cache-Control "public"; add_header X-Content-Type-Options "nosniff" always; }
}
